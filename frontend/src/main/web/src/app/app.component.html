<div style="text-align:center">
  <h1>
    Welcome to {{ title }}!
  </h1>

  <h2>Customer List</h2>
  <div *ngIf="customers && customers.length > 0">
    <table style="margin: 0 auto; border-collapse: collapse; width: 50%;">
      <thead>
        <tr style="border-bottom: 1px solid #ddd;">
          <th style="padding: 8px; text-align: left;">ID</th>
          <th style="padding: 8px; text-align: left;">Name</th>
          <th style="padding: 8px; text-align: left;">Email</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let customer of customers" style="border-bottom: 1px solid #eee;">
          <td style="padding: 8px; text-align: left;">{{ customer.id }}</td>
          <td style="padding: 8px; text-align: left;">{{ customer.name }}</td>
          <td style="padding: 8px; text-align: left;">{{ customer.email }}</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div *ngIf="!customers || customers.length === 0">
    <p>No customers found.</p>
  </div>

  <hr style="width: 50%; margin: 20px auto;">

  <h3>Add New Customer</h3>
  <form (submit)="addCustomer(name.value, email.value); name.value=''; email.value=''" style="display: inline-block; text-align: left;">
    <div>
      <label>Name: </label>
      <input #name type="text" required>
    </div>
    <div style="margin-top: 10px;">
      <label>Email: </label>
      <input #email type="email" required>
    </div>
    <button type="submit" style="margin-top: 10px;">Add Customer</button>
  </form>
</div>
